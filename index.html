<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloom English — Daily Writing Buddy</title>
<style>
:root{--ink:#17305c;--blue:#355bd7;--soft:#edf3ff;--mint:#e6faf0;--bg:#f7f9fe;--border:#dce5f4;--muted:#62718d;--coral:#ff856e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,-apple-system,sans-serif;font-size:16px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}.shell{max-width:1100px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center;font-size:23px;font-weight:900;letter-spacing:-.7px}.logo{display:grid;place-items:center;width:45px;height:45px;border-radius:16px;background:#d8e5ff;font-size:26px}.tag{background:#fff;border:1px solid var(--border);border-radius:100px;padding:9px 15px;color:var(--muted);font-size:13px}.hero{background:linear-gradient(110deg,#3761d7,#7798f3);color:white;padding:31px;border-radius:28px;display:flex;justify-content:space-between;gap:24px;align-items:center;box-shadow:0 14px 35px #2d55ae20}.hero h1{margin:4px 0 8px;font-size:clamp(26px,4vw,38px);letter-spacing:-1.1px}.hero p{margin:0;opacity:.92;line-height:1.5}.hero-emoji{font-size:70px;filter:drop-shadow(0 8px 10px #1b3d9836)}.layout{display:grid;grid-template-columns:220px 1fr;gap:24px;margin-top:23px}.sidebar{background:white;border:1px solid var(--border);border-radius:23px;padding:14px;height:max-content}.tab{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:14px 13px;background:transparent;border:0;border-radius:13px;font-weight:700;color:var(--muted);margin:3px 0}.tab.active{background:var(--soft);color:var(--blue)}.content{min-width:0}.panel{background:#fff;border:1px solid var(--border);border-radius:23px;padding:26px;box-shadow:0 7px 22px #1a38700a;margin-bottom:18px}.panel h2{margin:0 0 7px;font-size:25px;letter-spacing:-.6px}.panel p{line-height:1.55}.sub{color:var(--muted);margin-top:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stat{background:#f4f7ff;border:1px solid #e7edfc;border-radius:18px;padding:18px}.stat strong{display:block;font-size:30px;margin-top:5px;color:var(--blue)}.stat small{color:var(--muted);font-weight:700}.btn{border:0;background:var(--blue);color:#fff;font-weight:800;padding:12px 18px;border-radius:13px;box-shadow:0 5px 12px #355bd72a}.btn.secondary{background:#eef3ff;color:#2851c5;box-shadow:none}.btn.ghost{background:white;border:1px solid var(--border);box-shadow:none;color:var(--ink)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.label{display:block;font-weight:800;margin:18px 0 8px}.field{width:100%;background:#fff;border:1.5px solid #d8e1ef;border-radius:13px;padding:12px 13px;outline:none;color:var(--ink)}.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px #355bd71c}textarea.field{min-height:185px;resize:vertical;line-height:1.6}.prompt{background:var(--soft);border-radius:18px;padding:16px 18px;margin:19px 0;line-height:1.6}.word{display:inline-block;background:#e7f9f0;color:#19774e;padding:8px 12px;border-radius:20px;font-weight:800;margin:5px 5px 5px 0}.choice{display:block;width:100%;text-align:left;background:white;border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;margin:10px 0;font-weight:700;color:var(--ink)}.choice.selected{background:#eaf0ff;border-color:var(--blue)}.choice.correct{background:#e3f8ed;border-color:#25a36a}.choice.wrong{background:#fff0ed;border-color:#e56e5f}.feedback{padding:15px 18px;border-radius:16px;background:#f0f5ff;margin:16px 0;line-height:1.6}.feedback.success{background:#e9f9f0}.feedback.warning{background:#fff5e6}.small{font-size:13px;color:var(--muted)}.pill{font-size:12px;font-weight:800;border-radius:20px;background:#e5f7ef;color:#14794b;padding:6px 10px}.empty{text-align:center;padding:30px;color:var(--muted)}.entry{border-top:1px solid var(--border);padding:15px 0}.entry p{white-space:pre-wrap;margin:5px 0}.right{float:right;color:var(--muted);font-size:12px}.progress{height:11px;border-radius:20px;background:#e9eef9;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:#5f81e6;border-radius:20px}.question{font-size:21px;font-weight:800;line-height:1.5}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#19346f;color:white;padding:11px 18px;border-radius:12px;display:none;box-shadow:0 10px 30px #0002;z-index:20}.footer{text-align:center;color:#8290a8;font-size:12px;padding:20px}@media(max-width:720px){.shell{padding:13px}.layout{display:block}.sidebar{display:flex;overflow:auto;white-space:nowrap;padding:7px;margin-bottom:15px;gap:5px}.tab{width:auto;flex:0 0 auto;padding:11px}.tab .txt{display:none}.panel{padding:19px}.hero{padding:22px}.hero-emoji{font-size:48px}.grid2{grid-template-columns:1fr}.tag{display:none}}
@media print{.sidebar,.top,.hero,.actions,.footer{display:none!important}.layout{display:block}.panel{box-shadow:none;border:0}}
</style>
</head>
<body><div class="shell"><header class="top"><div class="brand"><span class="logo">🌱</span> Bloom English</div><div class="tag">Your friendly daily writing buddy ✨</div></header><section class="hero"><div><div style="font-size:13px;font-weight:800;letter-spacing:1px;opacity:.88">LEARN A LITTLE, GROW A LOT</div><h1 id="heroTitle">Hello, writer! 👋</h1><p>Practice English, tell your stories, and grow more confident every day.</p></div><div class="hero-emoji" aria-hidden="true">🦊</div></section><div class="layout"><nav class="sidebar" aria-label="Main navigation"><button class="tab active" data-page="home">🏡 <span class="txt">Dashboard</span></button><button class="tab" data-page="learn">📚 <span class="txt">Daily lesson</span></button><button class="tab" data-page="quiz">🧩 <span class="txt">Word quiz</span></button><button class="tab" data-page="diary">✍️ <span class="txt">My diary</span></button><button class="tab" data-page="report">📈 <span class="txt">Progress report</span></button><button class="tab" data-page="profile">⚙️ <span class="txt">My profile</span></button></nav><main id="main" class="content" aria-live="polite"></main></div><footer class="footer">AI-connected when configured · Progress is saved in this browser · Use a nickname, not real personal details</footer></div><div id="toast" role="status"></div>
<script>
'use strict';
const KEY='bloom-english-v1';const day=()=>new Date().toLocaleDateString('en-CA');const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial={name:'',age:'',grade:'',location:'',hobbies:'',entries:[],quiz:[],lessonDates:[]};let data;try{data={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data={...initial}};let page='home',quizIndex=0,quizAnswers=[],draft='',followAnswer='',stage='write',aiReview=null,aiStatus='';const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const $=id=>document.getElementById(id);const toast=s=>{let el=$('toast');el.textContent=s;el.style.display='block';clearTimeout(window.tid);window.tid=setTimeout(()=>el.style.display='none',2400)};
const bank=[{w:'curious',meaning:'wanting to learn or know more',example:'I am curious about the stars.',wrong:['feeling very sleepy','moving very slowly','being afraid of water']},{w:'brave',meaning:'showing courage when something is scary',example:'The brave girl tried something new.',wrong:['always being quiet','feeling hungry','easily getting lost']},{w:'discover',meaning:'to find something new',example:'We discover interesting things at the park.',wrong:['to forget something','to draw quickly','to give away a gift']},{w:'practice',meaning:'to do something again to get better',example:'I practice English every day.',wrong:['to stop learning','to lose a game','to tell a joke']},{w:'grateful',meaning:'feeling thankful',example:'I am grateful for my friends.',wrong:['feeling bored','having many pencils','getting very angry']},{w:'adventure',meaning:'an exciting or unusual experience',example:'Our trip was an adventure.',wrong:['a small breakfast','an ordinary pencil','a classroom rule']},{w:'improve',meaning:'to make something better',example:'I want to improve my writing.',wrong:['to break an object','to run away','to hide a secret']},{w:'imagine',meaning:'to form a picture or idea in your mind',example:'Imagine a castle in the clouds.',wrong:['to carry something heavy','to count numbers','to clean a window']},{w:'patient',meaning:'able to wait calmly',example:'My teacher is patient.',wrong:['always in a hurry','very noisy','good at jumping']}];
const daily=()=>{let n=Number(day().replaceAll('-',''))||1;return [bank[n%bank.length],bank[(n+3)%bank.length],bank[(n+6)%bank.length]]};
function card(title,body,subtitle=''){return `<section class="panel"><h2>${title}</h2>${subtitle?`<p class="sub">${subtitle}</p>`:''}${body}</section>`}function btn(s,action,kind=''){return `<button class="btn ${kind}" data-action="${action}">${s}</button>`}
function goto(p){page=p;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'smooth'})}
function home(){const total=data.entries.length,quizzes=data.quiz.length,words=new Set(data.quiz.flatMap(q=>q.words||[])).size;return card('Your learning garden 🌼',`<div class="grid2"><div class="stat"><small>Diary entries</small><strong>${total}</strong></div><div class="stat"><small>Quizzes completed</small><strong>${quizzes}</strong></div><div class="stat"><small>Words practiced</small><strong>${words}</strong></div><div class="stat"><small>Days with lessons</small><strong>${new Set(data.lessonDates).size}</strong></div></div><div class="prompt">${data.name?`Welcome back, <b>${safe(data.name)}</b>! `:'Welcome, new writer! '}Even a few sentences are a great start. 🌟</div><div class="actions">${btn('Write today’s diary ✍️','diary')}${btn('Try the word quiz 🧩','quiz','secondary')}</div>`)+card('Today’s word garden 🌿',`<p>Use one of these words in your diary today:</p>${daily().map(x=>`<span class="word">${x.w}</span>`).join('')}<div class="actions">${btn('View mini lesson','learn','secondary')}</div>`)}
function learn(){let words=daily(),done=data.lessonDates.includes(day());return card('Your daily mini lesson 📚',`<div class="prompt"><b>Today’s goal:</b> Learn three words and practice one simple grammar pattern.</div>${words.map(x=>`<div class="entry"><span class="word">${safe(x.w)}</span><p><b>Meaning:</b> ${safe(x.meaning)}</p><p class="small">Example: “${safe(x.example)}”</p></div>`).join('')}`, 'A fresh set of words appears each day.')+card('🌟 Grammar mission: be + -ing',`<div class="prompt"><b>Today’s mission:</b> Talk about what is happening <b>right now</b>!</div><p>Use <b>am / is / are</b> + a verb ending in <b>-ing</b>.</p><div class="entry"><p>🙋 <b>I am reading.</b></p><p>🦊 <b>She is playing.</b></p><p>⚽ <b>They are running.</b></p></div><p class="small"><b>Try it:</b> Say or write one sentence about what you are doing now. For example: “I am learning English!”</p><div class="actions">${btn(done?'✓ Lesson completed':'Mark lesson complete','lessonDone',done?'secondary':'')}${btn('Word quiz 🧩','quiz','secondary')}</div><p class="small">This grammar mission is part of the Daily Lesson only — no grammar questions in Word Quiz.</p>`)}
function quiz(){let set=daily(),q=set[quizIndex],done=quizIndex>=set.length;if(done){let score=quizAnswers.filter(a=>a.correct).length;return card('Quiz complete! 🎉',`<div class="prompt"><div style="font-size:35px;font-weight:900">${score} / ${set.length}</div>${score===3?'Fantastic! You know these words!':'Nice effort! Every try helps you learn.'}</div><div class="actions">${btn('Save quiz result','saveQuiz')}${btn('Try again','retryQuiz','secondary')}</div>`)}let opts=[q.meaning,...q.wrong].sort((a,b)=>hash(q.w+a)-hash(q.w+b));const selected=quizAnswers[quizIndex];return card('Word quiz 🧩',`<p class="small">Question ${quizIndex+1} of ${set.length}</p><div class="progress"><i style="width:${quizIndex/set.length*100}%"></i></div><p class="question">What does “${safe(q.w)}” mean?</p>${opts.map((o,i)=>`<button class="choice ${selected?(o===q.meaning?'correct':o===selected.value?'wrong':''):''}" data-choice="${i}" data-value="${safe(o)}" ${selected?'disabled':''}>${safe(o)}</button>`).join('')}${selected?`<div class="feedback ${selected.correct?'success':'warning'}">${selected.correct?'✅ Correct!':'💡 Good try!'} <b>${safe(q.w)}</b> means “${safe(q.meaning)}”.</div><div class="actions">${btn(quizIndex===2?'See my result':'Next question →','nextQuestion')}</div>`:''}`,'Find the meaning of each word. Mistakes are part of learning!')}
function hash(s){let h=0;for(let c of s)h+=c.charCodeAt(0);return h}
function analyze(text){let suggestions=[],corrected=text.trim().replace(/\s+([,.!?])/g,'$1').replace(/ {2,}/g,' ');const fixes=[[ /\bi\b/g,'I','Remember to capitalize “I”.'],[/\bdont\b/gi,"don't",'Use an apostrophe in “don’t”.'],[/\bcant\b/gi,"can't",'Use an apostrophe in “can’t”.'],[/\bim\b/gi,"I'm",'Try “I’m” instead of “im”.'],[/\bi am go to\b/gi,'I am going to','Try “I am going to” for a plan.'],[/\bi goed\b/gi,'I went','The past tense of “go” is “went”.'],[/\bi eated\b/gi,'I ate','The past tense of “eat” is “ate”.'],[/\bi play soccer yesterday\b/gi,'I played soccer yesterday','For yesterday, try “played”.'],[/\bi has a\b/gi,'I have a','With “I”, use “have”.']];for(const [re,to,msg] of fixes){if(re.test(corrected)){corrected=corrected.replace(re,to);suggestions.push(msg)}}corrected=corrected.replace(/(^|[.!?]\s+)([a-z])/g,(all,p,c)=>p+c.toUpperCase());if(corrected&&!/[.!?]$/.test(corrected)){corrected+='.';suggestions.push('End your sentence with a punctuation mark.')}if(!suggestions.length)suggestions.push('Nice clear writing! Try adding a detail about how you felt or why it happened.');let count=text.trim().split(/\s+/).filter(Boolean).length;return {corrected,suggestions,count}}
function questionFor(t){let s=t.toLowerCase();if(/school|class|teacher|homework|study/.test(s))return 'What was the most interesting thing you learned today?';if(/friend|play|game|soccer|sport/.test(s))return 'What was your favorite moment, and why?';if(/family|mom|dad|mother|father|sister|brother/.test(s))return 'What is one thing you enjoyed doing with your family?';if(/food|eat|lunch|dinner|breakfast/.test(s))return 'What food would you like to try next, and why?';if(/happy|sad|excited|nervous/.test(s))return 'What happened that made you feel that way?';return 'What was the best part of your day, and why?'}
function diary(){let last=data.entries[0];if(stage==='follow')return card('One more question for you! 💬',reviewView(),'Your story has been submitted. Answer this question to complete your diary.');return card('My English diary ✍️',`<p class="sub">Write a few sentences about your day. Your buddy will give you a kind first review.</p><div class="prompt">🌈 <b>Writing idea:</b> What made you smile today? What did you do? How did you feel?<p class="small" style="margin-bottom:0">Challenge: use <b>${daily()[0].w}</b> in a sentence.</p></div><label class="label" for="diaryText">Today's story</label><textarea id="diaryText" class="field" placeholder="Today I...">${safe(draft)}</textarea><p class="small">Aim for 2–5 sentences. You can write more!</p><div class="actions">${btn('Submit Today’s Story →','reviewDiary')}</div>`)+card('Previous stories 📖',last?data.entries.slice(0,5).map(e=>`<div class="entry"><span class="right">${safe(e.date)}</span><b>${safe(e.date)}</b><p>${safe(e.original)}</p><div class="small">${e.words} words · ${e.answer?'Follow-up answered ✅':'Follow-up not answered'}</div></div>`).join(''):'<div class="empty">Your diary stories will appear here after your first entry.</div>')}
function reviewView(){let result=aiReview||analyze(draft),question='What was the most interesting thing you learned today?';return `<div class="prompt" style="background:#e6faf0;border-color:#b9e4cb"><b>🦊 Here’s your next question!</b><p class="question" style="margin-bottom:0">${safe(question)}</p></div><label class="label" for="followText">Your answer</label><textarea id="followText" class="field" style="min-height:110px" placeholder="The most interesting thing I learned today was...">${safe(followAnswer)}</textarea><div class="actions">${btn('Save my diary 🌟','saveDiary')}${btn('← Edit my story','editDiary','secondary')}</div><div class="feedback success"><b>🦊 Your buddy says:</b> ${safe(aiReview?.encouragement||'Great job sharing your day! Here are a few ideas to make your writing clearer.')}</div><div class="label">A polished version</div><div class="prompt">${safe(result.corrected)}</div><div class="label">Little learning tips</div><ul>${result.suggestions.map(s=>`<li style="margin-bottom:7px">${safe(s)}</li>`).join('')}</ul><p class="small">${aiReview?'Feedback generated by AI; it can make mistakes.':'Offline sample feedback (AI unavailable).'} Review corrections before relying on them.</p>`}
function report(){let entries=data.entries,all=entries.reduce((n,e)=>n+e.words,0),qs=data.quiz,scores=qs.map(q=>q.score),avg=qs.length?Math.round(scores.reduce((a,b)=>a+b,0)/qs.length/3*100):0,week=entries.filter(e=>Date.now()-new Date(e.createdAt).getTime()<7*86400000),most=entries.flatMap(e=>e.tips||[]).reduce((acc,t)=>(acc[t]=(acc[t]||0)+1,acc),{}),top=Object.entries(most).sort((a,b)=>b[1]-a[1]).slice(0,3);return card('Parent & teacher report 📈',`<p class="sub">A snapshot of writing practice from this browser. Use “Print / save as PDF” to share with an adult.</p><div class="grid2"><div class="stat"><small>Total diary entries</small><strong>${entries.length}</strong></div><div class="stat"><small>Words written</small><strong>${all}</strong></div><div class="stat"><small>Entries in last 7 days</small><strong>${week.length}</strong></div><div class="stat"><small>Average quiz score</small><strong>${qs.length?avg+'%':'—'}</strong></div></div><h3>Writing practice</h3><div class="progress"><i style="width:${Math.min(100,week.length/7*100)}%"></i></div><p class="small">${week.length} of 7 days with a diary entry this week (goal: one per day)</p><h3>Common feedback</h3>${top.length?`<ul>${top.map(([t,n])=>`<li>${safe(t)} <span class="small">(${n}×)</span></li>`).join('')}</ul>`:'<p class="sub">No feedback yet. Write the first diary entry to get started.</p>'}<h3>Recent writing</h3>${entries.slice(0,4).map(e=>`<div class="entry"><b>${safe(e.date)}</b> · ${e.words} words<p>${safe(e.original)}</p><p class="small">Follow-up: ${safe(e.answer||'Not answered')}</p></div>`).join('')||'<p class="sub">No writing submitted yet.</p>'}<div class="actions">${btn('Print / Save as PDF','printReport','secondary')}${btn('Download report (.txt)','downloadReport','ghost')}</div><p class="small">Reports are generated on demand. Automatic weekly email delivery needs a backend/email service.</p>`)}
function profile(){return card('Meet your writing buddy 🦊',`<p class="sub">A few details help make practice feel more personal. Keep children’s personal information minimal.</p><label class="label" for="name">First name or nickname</label><input id="name" class="field" maxlength="40" value="${safe(data.name)}" placeholder="e.g. Alex"><div class="grid2"><div><label class="label" for="age">Age</label><input id="age" class="field" type="number" min="5" max="18" value="${safe(data.age)}"></div><div><label class="label" for="grade">Grade</label><input id="grade" class="field" maxlength="30" value="${safe(data.grade)}" placeholder="e.g. 5"></div></div><label class="label" for="hobbies">Hobbies and interests</label><input id="hobbies" class="field" maxlength="120" value="${safe(data.hobbies)}" placeholder="e.g. soccer, drawing, animals"><div class="actions">${btn('Save profile','saveProfile')}</div><p class="small">Location isn't required for this demo. All information stays on this device in browser storage.</p>`)+card('Your data',`<p class="sub">This prototype has no account system or cloud backup. Clearing browser data will erase progress.</p><div class="actions">${btn('Export my data','exportData','secondary')}${btn('Delete all local data','clearData','ghost')}</div>`)}
function render(){const pages={home,learn,quiz,diary,report,profile};$('main').innerHTML=pages[page]();$('heroTitle').textContent=data.name?`Hello, ${data.name}! 👋`:'Hello, writer! 👋';if(page==='diary'){let t=$('diaryText');if(t)t.addEventListener('input',e=>draft=e.target.value);let f=$('followText');if(f)f.addEventListener('input',e=>followAnswer=e.target.value)}}
document.addEventListener('click',async e=>{const tab=e.target.closest('[data-page]');if(tab){goto(tab.dataset.page);return}const choice=e.target.closest('[data-choice]');if(choice){let q=daily()[quizIndex];if(quizAnswers[quizIndex])return;quizAnswers[quizIndex]={value:choice.dataset.value,correct:choice.dataset.value===q.meaning};render();return}const a=e.target.closest('[data-action]');if(!a)return;switch(a.dataset.action){case 'diary':goto('diary');break;case 'quiz':quizIndex=0;quizAnswers=[];goto('quiz');break;case 'learn':goto('learn');break;case 'lessonDone':if(!data.lessonDates.includes(day()))data.lessonDates.push(day());save();render();toast('Lesson completed! 🌟');break;case 'nextQuestion':quizIndex++;render();break;case 'retryQuiz':quizIndex=0;quizAnswers=[];render();break;case 'saveQuiz':data.quiz.unshift({date:day(),score:quizAnswers.filter(a=>a.correct).length,words:daily().map(w=>w.w)});save();quizIndex=0;quizAnswers=[];goto('home');toast('Quiz score saved!');break;case 'reviewDiary':draft=$('diaryText').value.trim();if(draft.split(/\s+/).filter(Boolean).length<5){toast('Write at least five words first.');return}a.disabled=true;a.textContent='Asking AI…';aiReview=null;try{const response=await fetch('/.netlify/functions/review',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({diary:draft,age:data.age,grade:data.grade,hobbies:data.hobbies})});if(!response.ok)throw new Error('AI request failed');const j=await response.json();if(!j.corrected||!Array.isArray(j.suggestions)||!j.question)throw new Error('Invalid AI response');aiReview={corrected:j.corrected,suggestions:j.suggestions.slice(0,4),question:j.question,encouragement:j.encouragement,count:draft.split(/\s+/).length};}catch(err){toast('AI not configured or unavailable; using demo feedback.')}stage='follow';render();window.scrollTo({top:0,behavior:'smooth'});break;case 'editDiary':stage='write';render();break;case 'saveDiary':followAnswer=$('followText')?.value.trim()||'';if(followAnswer.split(/\s+/).filter(Boolean).length<3){toast('Please answer the question in English (3+ words).');return}let r=aiReview||analyze(draft);data.entries.unshift({date:day(),createdAt:new Date().toISOString(),original:draft,corrected:r.corrected,words:r.count,tips:r.suggestions,question:'What was the most interesting thing you learned today?',answer:followAnswer});save();draft='';followAnswer='';aiReview=null;stage='write';goto('diary');toast('Your story is saved! 🌼');break;case 'saveProfile':data.name=$('name').value.trim();data.age=$('age').value;data.grade=$('grade').value.trim();data.hobbies=$('hobbies').value.trim();save();render();toast('Profile saved!');break;case 'printReport':window.print();break;case 'downloadReport':{let s=`BLOOM ENGLISH PROGRESS REPORT\nStudent: ${data.name||'Learner'}\nDate: ${day()}\nEntries: ${data.entries.length}\nWords written: ${data.entries.reduce((n,e)=>n+e.words,0)}\nQuizzes: ${data.quiz.length}\n\nRECENT DIARY ENTRIES\n`+data.entries.map(e=>`${e.date}\n${e.original}\nFollow-up: ${e.answer}\n`).join('\n');download('bloom-report.txt',s,'text/plain');break}case 'exportData':download('bloom-data.json',JSON.stringify(data,null,2),'application/json');break;case 'clearData':if(confirm('Permanently delete all local progress and your profile?')){localStorage.removeItem(KEY);data=structuredClone(initial);draft='';followAnswer='';stage='write';goto('home');toast('Local data cleared.')}break}});
function download(name,text,type){let blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();
</script></body></html>
